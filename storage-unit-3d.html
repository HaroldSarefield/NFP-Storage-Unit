<title>NFP Storage Unit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: full-height app — 3D/2D stage on the left with view, layer and walk controls; find/inventory/edit panel on the right; stacks on phones. */
:root{
  --bg:#eef0ec; --surface:#ffffff; --surface-2:#f5f6f2; --line:#d8dbd3;
  --fg:#1f2320; --muted:#5d645d; --accent:#e8287f; --accent-ink:#ffffff;
  --sticky:#ff4fa3; --ok:#2f7d4f; --warn:#a86a00; --unk:#7b7f86; --scene:#e4e6e1;
  --plan-bg:#f3f4f0; --plan-line:#c9ccc4;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace; --f-hand:"Kalam","Comic Sans MS",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141714; --surface:#1c201c; --surface-2:#232823; --line:#323832;
  --fg:#e8ebe6; --muted:#9aa29a; --accent:#ff5aa0; --accent-ink:#1a0a12;
  --ok:#5cc489; --warn:#e2a93b; --unk:#9ba0a8; --scene:#1a1d1a; --plan-bg:#191c19; --plan-line:#353b35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141714; --surface:#1c201c; --surface-2:#232823; --line:#323832;
  --fg:#e8ebe6; --muted:#9aa29a; --accent:#ff5aa0; --accent-ink:#1a0a12;
  --ok:#5cc489; --warn:#e2a93b; --unk:#9ba0a8; --scene:#1a1d1a; --plan-bg:#191c19; --plan-line:#353b35; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:10px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px}
h1{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0}
header p{margin:0;color:var(--muted);font-size:13px}
#savestate{font-size:12px;color:var(--muted)}
.main{display:grid;grid-template-columns:380px minmax(0,1fr);gap:12px;min-height:0}
.stagewrap{display:grid;grid-template-rows:auto 1fr;gap:8px;min-height:0;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg-label{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--scene);min-height:360px}
#view{position:absolute;inset:0;touch-action:none}
#plan{position:absolute;inset:0;background:var(--plan-bg);display:flex;align-items:center;justify-content:center;padding:14px}
#plan svg{width:100%;height:100%;display:block}
.overlay{position:absolute;z-index:2;display:flex;gap:6px;flex-wrap:wrap}
.views{left:10px;top:10px;max-width:calc(100% - 20px)}
.chip{font:500 12px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.door{position:absolute;left:10px;bottom:10px;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:3px 8px;border-radius:6px;pointer-events:none;z-index:2}
.hint{position:absolute;right:10px;top:48px;font-size:11px;color:var(--muted);pointer-events:none;text-align:right;max-width:240px;z-index:2;background:color-mix(in srgb,var(--surface) 80%,transparent);padding:4px 8px;border-radius:6px}
.pad{position:absolute;right:12px;bottom:12px;z-index:3;display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px}
.pad button{border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:18px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button:active,.pad button.on{background:var(--fg);color:var(--bg)}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .right{grid-column:3;grid-row:2}.pad .down{grid-column:2;grid-row:3}
.pad .rise{grid-column:3;grid-row:1;font-size:12px}.pad .fall{grid-column:3;grid-row:3;font-size:12px}
.tip{position:absolute;pointer-events:none;z-index:4;background:var(--fg);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(10px,10px)}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.search{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.search input{width:100%;font-size:15px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.tabs{display:flex;gap:4px}
.tab{flex:1;font:600 12px var(--f-body);padding:7px 6px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface-2);border-color:var(--line);color:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.scroll{overflow:auto;min-height:0;flex:1}
.detail{padding:14px;flex:1;min-height:0;overflow:auto}
.note{display:inline-block;background:var(--sticky);color:#2a0716;font-family:var(--f-hand);font-weight:700;font-size:18px;line-height:1.15;padding:8px 10px;transform:rotate(-1.5deg);box-shadow:0 2px 0 rgba(0,0,0,.15);max-width:100%}
.note.faint{background:#ffb3d6;font-weight:400;font-style:italic}
.detail h2{font:700 16px var(--f-display);margin:10px 0 2px}
.meta{font-size:12px;color:var(--muted)}
.detail ul{margin:8px 0 0;padding-left:18px}
.detail li{margin:2px 0}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.icon{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:2px 4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
form.edit{display:grid;gap:10px;margin-top:10px}
form.edit label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
form.edit input[type=text],form.edit input:not([type]),form.edit textarea,form.edit select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:14px;font-weight:400;color:var(--fg)}
form.edit textarea{min-height:92px;resize:vertical}
form.edit .check{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--fg)}
.group{padding:10px 14px 4px;font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--surface);z-index:1;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;width:100%;text-align:left}
.row:hover{background:var(--surface-2)}
.row .n{font-weight:500;min-width:0}
.row .c{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.row .s{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:var(--muted)}
.was{color:var(--warn);font-weight:600}
.pill{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.seen{color:var(--ok)} .pill.likely{color:var(--warn)} .pill.unknown{color:var(--unk)} .pill.edited{color:var(--accent)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.2)}
.empty{padding:20px 14px;color:var(--muted)}
.addrow{padding:10px 14px;border-bottom:1px solid var(--line)}
.ask{font:800 18px var(--f-display);letter-spacing:-.01em}
.qwrap{position:relative}
.qwrap input{padding-right:36px!important;font-size:17px!important;padding-block:12px!important;border:2px solid var(--line)!important}
.qwrap input:focus{border-color:var(--accent)!important;outline:none}
.qclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:22px;color:var(--muted);cursor:pointer;padding:4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ctl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.ctl select{font-size:13px;font-weight:500;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.where{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:12px;align-items:start;margin-top:8px}
.where .big{font:800 17px var(--f-display);line-height:1.2;margin:0 0 4px}
.where p{margin:0 0 6px}
.mini{width:112px;height:auto;display:block}
.count{font:600 24px var(--f-mono);font-variant-numeric:tabular-nums}
.back{border:0;background:transparent;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:13px}
details.sec>summary{list-style:none;cursor:pointer;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;font-weight:600}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .subtle{margin-left:auto;margin-right:10px} details.sec>summary::after{content:"＋";color:var(--muted)} details.sec[open]>summary::after{content:"－"}
.hdr{padding:10px 14px 6px;font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.subtle{font-size:12px;color:var(--muted)}
.linkbtn{border:0;background:transparent;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
@media (max-width:900px){
  .app{height:auto;grid-template-rows:auto auto}
  .main{grid-template-columns:1fr}
  .stage{height:64vh}
  .scroll{max-height:70vh}
  .detail{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <h1>NFP Storage Unit</h1>
    <p>Type what you need and the model shows you where it is.</p>
    <span id="savestate">Connecting…</span>
  </header>
  <div class="main">
    <aside class="panel">
      <div class="search">
        <label for="q" class="ask">What are you looking for?</label>
        <div class="qwrap"><input id="q" type="search" placeholder="Try “diapers”, “baby scale” or “frames”" autocomplete="off"><button class="qclear" id="qclear" aria-label="Clear search" hidden>×</button></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="detail" id="detail" hidden></div>
      <div class="scroll" id="list"></div>
    </aside>
    <div class="stagewrap">
      <div class="bar">
        <div class="seg" role="group" aria-label="Display">
          <button id="m-3d" aria-pressed="true">3D</button>
          <button id="m-2d" aria-pressed="false">Floor plan</button>
        </div>
        <label class="ctl" for="viewsel">View
          <select id="viewsel"><option value="door">From the door</option><option value="top">From above</option><option value="left">Left wall</option><option value="right">Right wall</option><option value="back">Back wall</option><option value="" hidden>Custom</option></select></label>
        <label class="ctl" for="layersel">Show
          <select id="layersel"></select></label>
        <button class="chip" id="nav-walk" aria-pressed="false">Walk around</button>
        <button class="chip" id="t-float" aria-pressed="false">Labels on top</button>
      </div>
      <div class="stage" id="stage">
        <div id="view" aria-label="3D model of the storage unit"></div>
        <div id="plan" hidden></div>
        <div class="door">▲ Door</div>
        <div class="hint" id="hint">Drag to turn · scroll or pinch to zoom · click any box</div>
        <div class="pad" id="pad" hidden aria-label="Walk controls">
          <button class="up" data-k="f" aria-label="Walk forward">▲</button>
          <button class="left" data-k="l" aria-label="Step left">◀</button>
          <button class="right" data-k="r" aria-label="Step right">▶</button>
          <button class="down" data-k="b" aria-label="Walk back">▼</button>
          <button class="rise" data-k="u" aria-label="Raise view">up</button>
          <button class="fall" data-k="d" aria-label="Lower view">dn</button>
        </div>
        <div class="tip" id="tip" hidden></div>
      </div>
    </div>
  </div>
</div>

(function computeLevels(){
  const overlap = (a,b)=> a.p[0] < b.p[0]+b.s[0]-0.05 && b.p[0] < a.p[0]+a.s[0]-0.05 && a.p[2] < b.p[2]+b.s[2]-0.05 && b.p[2] < a.p[2]+a.s[2]-0.05;
  const sorted = [...C].sort((a,b)=>a.p[1]-b.p[1]);
  for (const c of sorted){
    if (c.noLayer){ LV[c.id]=0; continue; }
    if (c.p[1] < 0.05){ LV[c.id]=1; continue; }
    const under = C.filter(o=>o!==c && Math.abs(o.p[1]+o.s[1]-c.p[1])<0.2 && overlap(o,c));
    LV[c.id] = under.length ? 1+Math.max(...under.map(o=>LV[o.id]||1)) : 1+Math.round(c.p[1]/1.3);
  }
  for (const c of C) TOP[c.id] = !C.some(o=>o!==c && !o.noLayer && Math.abs(c.p[1]+c.s[1]-o.p[1])<0.2 && overlap(o,c));
})();

// Build container groups
const groups = {}; // id -> {group, sticky, sprite}
const FACE_N = {'+x':[-1,0,0],'-x':[1,0,0],'-z':[0,0,-1],'+z':[0,0,1]}; // our-x flipped into world
function build(id){
  const old = groups[id]; if (old){ scene.remove(old.group); if(old.sprite) scene.remove(old.sprite); }
  const c = eff(id), [x,y,z]=c.p, [w,h,d]=c.s;
  const g = new THREE.Group(); g.position.set(wx(x+w/2), y+h/2, z+d/2); g.userData.id=id;
  (B[c.kind]||B.box)(c,g,w,h,d);
  g.traverse(o=>{ if(o.isMesh){ o.userData.id=id; const ms=Array.isArray(o.material)?o.material:[o.material]; ms.forEach(m=>{m.userData.op=m.opacity; m.userData.tr=m.transparent;}); }});
  let stickyMesh=null, sprite=null;
  if (c.sticky){
    const n = FACE_N[c.face]; const faceW = (c.face==='+x'||c.face==='-x') ? d : w;
    const sz = Math.max(0.55, Math.min(faceW*0.8, h*0.85, 1.5));
    const mat = new THREE.MeshBasicMaterial({map:stickyTex(c.sticky, c.conf==='unreadable'), toneMapped:false});
    mat.userData.op=1; mat.userData.tr=false;
    stickyMesh = new THREE.Mesh(new THREE.PlaneGeometry(sz,sz), mat);
    const half = (c.face==='+x'||c.face==='-x') ? w/2 : d/2;
    stickyMesh.position.set(n[0]*(half+0.03), (c.kind==='tote'? -0.05 : 0), n[2]*(half+0.03));
    stickyMesh.rotation.y = Math.atan2(n[0], n[2]); stickyMesh.rotation.z = (rng(id)()-0.5)*0.08;
    stickyMesh.userData.id=id; g.add(stickyMesh);
    const sm = new THREE.SpriteMaterial({map:stickyTex(c.sticky, c.conf==='unreadable'), depthTest:false, toneMapped:false});
    sprite = new THREE.Sprite(sm); sprite.scale.set(1.1,1.1,1); sprite.position.set(g.position.x + n[0]*0.6, y+h+0.4, g.position.z + n[2]*0.6); sprite.renderOrder=10; sprite.userData.id=id; sprite.visible=false; scene.add(sprite);
  }
  if (!c.sticky && c.tag && c.kind!=='hazard'){
    const n = FACE_N[c.face]; const faceW = (c.face==='+x'||c.face==='-x') ? d : w;
    const tw = Math.max(0.9, Math.min(faceW*0.95, 1.6)), th = tw*0.5;
    const tm = new THREE.MeshBasicMaterial({map:tagTex(c.tag), toneMapped:false}); tm.userData.op=1; tm.userData.tr=false;
    stickyMesh = new THREE.Mesh(new THREE.PlaneGeometry(tw,th), tm);
    const half = (c.face==='+x'||c.face==='-x') ? w/2 : d/2;
    stickyMesh.position.set(n[0]*(half+0.06), Math.min(h/2-th/2-0.05, 0.6), n[2]*(half+0.06)); stickyMesh.rotation.y=Math.atan2(n[0],n[2]); stickyMesh.userData.id=id; g.add(stickyMesh);
    const sm=new THREE.SpriteMaterial({map:tagTex(c.tag), depthTest:false, toneMapped:false}); sprite=new THREE.Sprite(sm); sprite.scale.set(1.4,0.7,1);
    sprite.position.set(g.position.x+n[0]*0.6, y+h+0.4, g.position.z+n[2]*0.6); sprite.renderOrder=10; sprite.userData.id=id; sprite.visible=false; scene.add(sprite);
  }
  if (id==='large'){ // one big sign hanging across the back wall
    const sw=7.6*2/3, sh=sw*0.4, mat=new THREE.MeshBasicMaterial({map:signTex(), toneMapped:false, side:THREE.DoubleSide}); mat.userData.op=1; mat.userData.tr=false;
    const sign=new THREE.Mesh(new THREE.PlaneGeometry(sw,sh),mat);
    const wpos=new THREE.Vector3(wx(5.95), 6.6, 11.45); sign.position.copy(wpos).sub(g.position); sign.rotation.y=Math.PI; sign.userData.id=id; g.add(sign);
    const str=STD('#444',{r:.8}); str.userData.op=1; str.userData.tr=false; [-1,1].forEach(k=>{ const st=new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,H-6.6-sh/2,4),str); st.position.set(sign.position.x+k*sw*0.42, sign.position.y+sh/2+(H-6.6-sh/2)/2, sign.position.z); g.add(st); });
  }
  scene.add(g); groups[id] = {group:g, sticky:stickyMesh, sprite};
}
function buildAll(){ C.forEach(c=>build(c.id)); applyStyles(); }

// highlight / layers
let selected=null, highlight=null, floatLabels=false;
function applyStyles(){
  for (const c of C){
    const G = groups[c.id]; if(!G) continue;
    const ls = layerState(c.id), searchOn = !highlight || highlight.has(c.id);
    const visible = ls!=='off';
    const strong = ls==='on' && searchOn;
    G.group.visible = visible;
    G.group.traverse(o=>{ if(!o.isMesh) return; const ms=Array.isArray(o.material)?o.material:[o.material];
      ms.forEach(m=>{ if(strong){ m.opacity=m.userData.op; m.transparent=m.userData.tr; m.depthWrite=!m.userData.tr; }
        else { m.transparent=true; m.opacity=0.1; m.depthWrite=false; }
        if(m.emissive) m.emissive.set(selected===c.id?0x8a1747:0x000000); m.needsUpdate=true; });
      o.castShadow = strong; });
    if (G.sticky) G.sticky.material.color.set(selected===c.id ? 0xffe0ef : 0xffffff);

}

function stepWalk(dt){
  const k=walk.keys, sp=5*dt, f=[Math.sin(walk.yaw),Math.cos(walk.yaw)], r=[-Math.cos(walk.yaw),Math.sin(walk.yaw)];
  let mx=0,mz=0; if(k.f){mx+=f[0];mz+=f[1]} if(k.b){mx-=f[0];mz-=f[1]} if(k.r){mx+=r[0];mz+=r[1]} if(k.l){mx-=r[0];mz-=r[1]}
  walk.x=Math.min(9.6,Math.max(0.4,walk.x+mx*sp)); walk.z=Math.min(14.6,Math.max(-6,walk.z+mz*sp));
  if(k.u) walk.y=Math.min(7.6,walk.y+2.5*dt); if(k.d) walk.y=Math.max(1.5,walk.y-2.5*dt);

const confPill = c => c==='seen'?'<span class="pill seen">confirmed</span>':c==='likely'?'<span class="pill likely">best guess</span>':c==='unreadable'?'<span class="pill unknown">label unclear</span>':'<span class="pill unknown">not found yet</span>';
const invFor = id => invList().filter(r=>r.where.includes(id));
const boxOptions = sel => ['<option value="">Not found yet</option>', ...[...new Set(C.map(c=>c.zone))].map(z=>`<optgroup label="${esc(z)}">${C.filter(c=>c.zone===z).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(label(eff(c.id)))}</option>`).join('')}</optgroup>`)].join('');
const fpOverlap = (a,b)=> a.p[0] < b.p[0]+b.s[0]-0.05 && b.p[0] < a.p[0]+a.s[0]-0.05 && a.p[2] < b.p[2]+b.s[2]-0.05 && b.p[2] < a.p[2]+a.s[2]-0.05;
const ord = n => n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th';

// Plain-language directions to a container
function directions(id){
  const c=eff(id), x=c.p[0]+c.s[0]/2, ft=Math.max(1,Math.round(c.p[2]+c.s[2]/2));
  const side = c.zone.startsWith('Back wall') ? 'Go to the back wall' : x<3.5 ? 'Walk in and look along the left wall' : x>6.5 ? 'Walk in and look along the right wall' : 'Look in the middle of the unit';
  const where = c.zone.startsWith('Back wall') ? `${x<5?'left':'right'} side, about ${ft} ft from the door` : `about ${ft} ft in from the door`;
  const stack = C.filter(o=>fpOverlap(o,c)).sort((a,b)=>a.p[1]-b.p[1]); const idx=stack.findIndex(o=>o.id===id);
  const mid=c.p[1]+c.s[1]/2;
  const height = mid<1.2 ? 'on the floor' : mid<3.2 ? 'about waist height' : mid<5 ? 'about chest height' : 'up high, so you may need a step stool';
  const pos = stack.length>1 ? `It's ${ord(idx+1)} from the bottom in a stack of ${stack.length}, ${height}.` : (c.p[1]<0.05 ? `It sits ${height}.` : `It sits on top of other boxes, ${height}.`);
  if (c.kind==='hazard') return { head: c.zone, text: `Walk to the back-left corner, about ${ft} ft in from the door, and look up. The stain is on the ceiling right above the clear stacking bins.` };
  return { head: c.zone, text: `${side}, ${where}. ${pos}` };
}
function miniMap(ids){
  const S=10, set=new Set(ids);
  let svg=`<svg class="mini" viewBox="-4 -12 ${W*S+8} ${D*S+28}" role="img" aria-label="Map showing where it is">`;
  svg+=`<rect x="0" y="0" width="${W*S}" height="${D*S}" fill="var(--surface)" stroke="var(--fg)" stroke-width="2"/>`;
  C.forEach(c=>{ const x=c.p[0]*S, y=(D-c.p[2]-c.s[2])*S, w=c.s[0]*S, h=c.s[2]*S; if(!set.has(c.id)) svg+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--line)"/>`; });
  C.forEach(c=>{ if(!set.has(c.id)) return; const x=c.p[0]*S, y=(D-c.p[2]-c.s[2])*S, w=c.s[0]*S, h=c.s[2]*S;
    svg+=`<rect x="${x-2}" y="${y-2}" width="${w+4}" height="${h+4}" fill="#e8287f" stroke="#fff" stroke-width="1.5"><animate attributeName="opacity" values="1;.45;1" dur="1.6s" repeatCount="indefinite"/></rect>`; });
  svg+=`<line x1="0" y1="${D*S}" x2="${W*S}" y2="${D*S}" stroke="#e8287f" stroke-width="4" stroke-dasharray="6 4"/><text x="${W*S/2}" y="${D*S+13}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--muted)">DOOR</text><text x="${W*S/2}" y="-3" text-anchor="middle" font-size="8" fill="var(--muted)">BACK</text></svg>`;
  return svg;
}
function whereBlock(ids, fallback){
  if(!ids.length) return `<div class="where"><div><p class="big">Not spotted in the video</p><p>${esc(fallback||'Check the back wall boxes. Most boxed items from the list are there.')}</p></div>${miniMap(['brown','large'])}</div>`;
  const d=directions(ids[0]), c=eff(ids[0]);
  const also = ids.slice(1).map(id=>label(eff(id)));
  return `<div class="where"><div><p class="big">${esc(d.head)}</p><p>${esc(d.text)}</p>
    ${c.sticky?`<p>Look for the pink note: <span class="note ${c.conf==='unreadable'?'faint':''}" style="font-size:15px;padding:4px 8px">${esc(c.sticky)}</span></p>`:c.tag?`<p>Look for: <b>${esc(c.tag)}</b></p>`:`<p>Look for: <b>${esc(c.title)}</b></p>`}
    ${also.length?`<p class="subtle">Also check: ${also.map(esc).join(' · ')}</p>`:''}</div>${miniMap(ids)}</div>`;
}
const walkBtn = '<button class="btn" id="walkthere">Walk me there</button>';
function wireWalk(ids){ const b=document.getElementById('walkthere'); if(b) b.onclick=()=>{ if(mode==='2d') setMode('3d'); if(nav!=='walk'){ walk.x=5; walk.z=0.6; walk.y=5.2; walk.yaw=0; walk.pitch=-0.1; setNav('walk'); } focusOn(ids); }; }
function closeDetail(){ selected=null; editing=null; detailEl.hidden=true; listEl.hidden=false; highlight=q.value.trim()?highlight:null; applyStyles(); renderPlan(); }
function openCard(){ detailEl.hidden=false; listEl.hidden=true; detailEl.scrollTop=0; if (matchMedia('(max-width:900px)').matches) document.getElementById('stage').scrollIntoView({behavior: reduceMotion()?'auto':'smooth', block:'start'}); }

function showDetail(id){
  if (!id){ closeDetail(); return; }
  const c=eff(id), inv=invFor(id), edited=!!ovC[id];
  openCard();
  if (editing && editing.type==='c' && editing.id===id){
    detailEl.innerHTML = `<button class="back" id="dback">← Back</button><h2>Fix info: ${esc(c.title)}</h2>
      <form class="edit" id="ef">
        <label for="f-sticky">What the pink note says<input id="f-sticky" type="text" value="${esc(c.sticky||'')}" placeholder="Leave empty if there is no note"></label>
        <label for="f-title">Name<input id="f-title" type="text" value="${esc(c.title)}"></label>
        <label for="f-items">What's inside (one per line)<textarea id="f-items">${esc(c.items.join('\n'))}</textarea></label>
        <label class="check" for="f-checked"><input id="f-checked" type="checkbox" ${c.conf!=='unreadable'?'checked':''}> I've checked this in person</label>
        <div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" id="fcancel">Cancel</button>${edited?'<button class="btn" type="button" id="freset">Undo my changes</button>':''}</div>
      </form>`;
    document.getElementById('ef').onsubmit = async e=>{ e.preventDefault();
      const data={ sticky:document.getElementById('f-sticky').value.trim()||null, title:document.getElementById('f-title').value.trim()||byId[id].title,
        items:document.getElementById('f-items').value.split('\n').map(s=>s.trim()).filter(Boolean), conf:document.getElementById('f-checked').checked?'seen':'unreadable', updatedAt:Date.now() };
      editing=null; await saveC(id,data); };
    document.getElementById('fcancel').onclick=()=>{ editing=null; showDetail(id); };
    const rs=document.getElementById('freset'); if(rs) rs.onclick=async()=>{ editing=null; await saveC(id,null); };
    document.getElementById('dback').onclick=()=>{ editing=null; showDetail(id); };
    return;
  }
  detailEl.innerHTML = `<button class="back" id="dback">← Back to ${q.value.trim()?'results':'the list'}</button>
    <h2>${esc(label(c))}</h2>
    ${whereBlock([id])}
    <div class="hdr" style="padding-inline:0">Inside</div>
    <ul>${c.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
    ${inv.length?`<div class="hdr" style="padding-inline:0">From the inventory sheet</div><ul>${inv.map(r=>`<li><b>${esc(r.name)}</b>: ${esc(r.count)}</li>`).join('')}</ul>`:''}
    <div class="actions">${walkBtn}${canWrite!==false?'<button class="linkbtn" id="fedit">Something wrong? Fix it</button>':''}</div>
    <p class="subtle">Seen at ${c.t} in your video ${confPill(c.conf)} ${edited?'<span class="pill edited">edited</span>':''}</p>`;
  document.getElementById('dback').onclick=closeDetail;
  const fe=document.getElementById('fedit'); if(fe) fe.onclick=()=>{ editing={type:'c',id}; showDetail(id); };
  wireWalk([id]);
}

function showInvDetail(key){
  const r = invList().find(x=>x.key===key); if(!r){ closeDetail(); return; }
  openCard();
  if (editing && editing.type==='i' && editing.id===key){
    detailEl.innerHTML = `<button class="back" id="dback">← Back</button><h2>Fix info: ${esc(r.name)}</h2>
      <form class="edit" id="ef">
        ${r.custom?`<label for="f-name">Item name<input id="f-name" type="text" value="${esc(r.name)}"></label>`:''}
        <label for="f-count">How many<input id="f-count" type="text" value="${esc(r.count)}"></label>
        <label for="f-where">Where is it?<select id="f-where">${boxOptions(r.where[0]||'')}</select></label>
        <label for="f-conf">How sure<select id="f-conf"><option value="seen" ${r.conf==='seen'?'selected':''}>Confirmed</option><option value="likely" ${r.conf==='likely'?'selected':''}>Best guess</option><option value="unknown" ${r.conf==='unknown'?'selected':''}>Not found yet</option></select></label>
        <label for="f-note">Note<input id="f-note" type="text" value="${esc(r.note)}"></label>
        <div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" id="fcancel">Cancel</button>${r.custom?'<button class="btn" type="button" id="fdel">Delete item</button>':(ovI[key]?'<button class="btn" type="button" id="freset">Undo my changes</button>':'')}</div>
      </form>`;
    document.getElementById('ef').onsubmit=async e=>{ e.preventDefault();
      const w=document.getElementById('f-where').value, old=r.where;
      const data={ ...(r.custom?{custom:true, sec:r.sec, name:document.getElementById('f-name').value.trim()||r.name}:{}), count:document.getElementById('f-count').value.trim(), where: w? (old[0]===w? old : [w]) : [], conf:document.getElementById('f-conf').value, note:document.getElementById('f-note').value.trim(), updatedAt:Date.now() };
      editing=null; await saveI(key,data); };
    document.getElementById('fcancel').onclick=document.getElementById('dback').onclick=()=>{ editing=null; showInvDetail(key); };
    const rs=document.getElementById('freset'); if(rs) rs.onclick=async()=>{ editing=null; await saveI(key,null); };
    const dl=document.getElementById('fdel'); if(dl) dl.onclick=async()=>{ editing=null; closeDetail(); await saveI(key,null); };
    return;
  }
  detailEl.innerHTML = `<button class="back" id="dback">← Back to ${q.value.trim()?'results':'the list'}</button>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px"><h2 style="margin:0">${esc(r.name)}</h2><span class="count">${esc(r.count)}</span></div>
    ${r.was?`<p class="subtle" style="margin:2px 0 0">Count corrected by hand (typed sheet said ${esc(r.was)})</p>`:''}
    ${whereBlock(r.where)}
    ${r.note?`<p class="subtle">Note: ${esc(r.note)}</p>`:''}
    <div class="actions">${r.where.length?walkBtn:''}${canWrite!==false?'<button class="linkbtn" id="fedit">Something wrong? Fix it</button>':''}</div>
    <p class="subtle">${confPill(r.conf)} ${ovI[key]&&!r.custom?'<span class="pill edited">edited</span>':''}</p>`;
  document.getElementById('dback').onclick=closeDetail;
  const fe=document.getElementById('fedit'); if(fe) fe.onclick=()=>{ editing={type:'i',id:key}; showInvDetail(key); };
  wireWalk(r.where);
}

function showNewItem(){
  editing={type:'new'}; openCard();
  detailEl.innerHTML = `<button class="back" id="dback">← Back</button><h2>Add something to the list</h2>
    <form class="edit" id="ef">
      <label for="n-name">What is it?<input id="n-name" type="text" required></label>
      <label for="n-count">How many<input id="n-count" type="text"></label>
      <label for="n-where">Where is it?<select id="n-where">${boxOptions(selected||'')}</select></label>
      <label for="n-sec">Group<select id="n-sec">${SECTIONS.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label>
      <label for="n-note">Note<input id="n-note" type="text"></label>
      <div class="actions"><button class="btn primary" type="submit">Add</button><button class="btn" type="button" id="fcancel">Cancel</button></div>
    </form>`;
  document.getElementById('ef').onsubmit=async e=>{ e.preventDefault(); const name=document.getElementById('n-name').value.trim(); if(!name) return;
    const key='c-'+slug(name)+'-'+Date.now().toString(36), w=document.getElementById('n-where').value;
    editing=null; closeDetail();
    await saveI(key,{custom:true,name,count:document.getElementById('n-count').value.trim()||'—',sec:document.getElementById('n-sec').value,where:w?[w]:[],conf:w?'seen':'unknown',note:document.getElementById('n-note').value.trim(),updatedAt:Date.now()}); };
  document.getElementById('fcancel').onclick=document.getElementById('dback').onclick=()=>{ editing=null; closeDetail(); };
}

function select(id, fly=true){ selected=id; editing=null; highlight=new Set([id]); showDetail(id); applyStyles(); renderPlan(); if(fly) focusOn([id]); }
function pickItem(key){ const r=invList().find(x=>x.key===key); if(!r) return; editing=null; selected=r.where[0]||null;
  highlight = new Set(r.where.length? r.where : ['brown','large']); showInvDetail(key); applyStyles(); renderPlan(); focusOn(r.where.length? r.where : ['brown','large']); }

// search: forgiving matching (plurals + common other words)
const SYN = { // other words people might type → phrases to look for (| separated)
  leak:'water damage', mold:'water damage', wet:'water damage', ceiling:'water damage', damage:'water damage',
  toilet:'potty|potti', potty:'potty|potti', playpen:'pack n play', crib:'crib', bp:'blood pressure|bp', cuff:'bp cuff|cuff',
  pump:'breast pump|pump', seat:'seat|bumbo|booster', swing:'swing', computer:'laptop|monitor|keyboard|docking', tv:'monitor', screen:'monitor',
  graduation:'grad cap', cap:'grad cap', thermometer:'thermomet', stroller:'stroller' };
const stem = w => w.length>3 ? w.replace(/(es|s)$/,'') : w;
function matcher(qs){
  const words=qs.toLowerCase().replace(/pack (and|&) play/g,'pack n play').split(/\s+/).filter(Boolean);
  const alts=words.map(w=>[stem(w), ...((SYN[w]||SYN[stem(w)]||'').split('|').filter(Boolean))]);
  return hay => { const h=hay.toLowerCase(); return alts.every(list=>list.some(a=>h.includes(a))); };
}
const QUICK = ['Diapers','Baby scales','Grooming kits','Toys','Frames','Handouts','Swings','Models','Books'];
function rowItem(r){ const where = r.where.length ? eff(r.where[0]).zone : 'Not spotted yet';
  return `<button class="row" data-key="${esc(r.key)}"><span class="n">${esc(r.name)}</span><span class="c">${esc(r.count)}</span><span class="s"><span>${esc(where)}</span>${r.conf!=='seen'?confPill(r.conf):''}</span></button>`; }
function rowBox(c){ return `<button class="row" data-ids="${c.id}"><span class="n"><span class="swatch" style="background:${c.col}"></span>${esc(label(c))}</span><span class="c"></span><span class="s"><span>${esc(c.zone)}</span></span></button>`; }

function render(){
  const needle=q.value.trim(); qclear.hidden=!needle;
  document.getElementById('chips').innerHTML = needle ? '' : QUICK.map(t=>`<button class="chip" data-q="${t}">${t}</button>`).join('');
  document.querySelectorAll('#chips .chip').forEach(b=>b.onclick=()=>{ q.value=b.dataset.q; render(); const first=listEl.querySelector('.row'); if(first) first.click(); });
  let html=''; const all=invList();
  if (needle){
    const m=matcher(needle);
    const items=all.filter(r=>m(r.name+' '+r.note+' '+r.sec));
    const boxes=C.map(c=>eff(c.id)).filter(c=>m([c.title,c.sticky||'',c.tag||'',c.items.join(' ')].join(' ')));
    const hits=new Set(); items.forEach(r=>r.where.forEach(id=>hits.add(id))); boxes.forEach(c=>hits.add(c.id));
    highlight = hits.size? hits : new Set();
    if (items.length) html+=`<div class="hdr">On the inventory list</div>`+items.map(rowItem).join('');
    if (boxes.length) html+=`<div class="hdr">Boxes &amp; bins</div>`+boxes.map(rowBox).join('');
    if (!items.length && !boxes.length) html=`<div class="empty"><b>Nothing matches “${esc(needle)}”.</b><br>Try a shorter word, or check the back wall boxes, where most boxed items from the list are kept.${canWrite!==false?'<div class="actions"><button class="btn" id="addItem">Add it to the list</button></div>':''}</div>`;
  } else {
    if (!selected) highlight=null;
    html+=`<div class="hdr">Or browse everything</div>`;
    const secs=[...SECTIONS, ...new Set(all.map(r=>r.sec).filter(s=>!SECTIONS.includes(s)))];
    secs.forEach(sec=>{ const rs=all.filter(r=>r.sec===sec); if(!rs.length) return;
      html+=`<details class="sec" data-sec="${esc(sec)}" ${openSecs.has(sec)?'open':''}><summary>${esc(sec)} <span class="subtle">${rs.length}</span></summary>${rs.map(rowItem).join('')}</details>`; });
    const zones=[...new Set(C.map(c=>c.zone))];
    html+=`<details class="sec" data-sec="__boxes" ${openSecs.has('__boxes')?'open':''}><summary>Every box, by location <span class="subtle">${C.length}</span></summary>${zones.map(z=>`<div class="hdr">${esc(z)}</div>`+C.filter(c=>c.zone===z).map(c=>rowBox(eff(c.id))).join('')).join('')}</details>`;
    if (canWrite!==false) html+=`<div class="addrow"><button class="linkbtn" id="addItem">+ Add something that's not on the list</button></div>`;
  }
  listEl.innerHTML=html;
  listEl.querySelectorAll('details.sec').forEach(d=>d.addEventListener('toggle',()=>{ d.open?openSecs.add(d.dataset.sec):openSecs.delete(d.dataset.sec); }));
  const ab=document.getElementById('addItem'); if(ab) ab.onclick=showNewItem;
  listEl.querySelectorAll('.row[data-key]').forEach(b=>b.onclick=()=>pickItem(b.dataset.key));
  listEl.querySelectorAll('.row[data-ids]').forEach(b=>b.onclick=()=>select(b.dataset.ids));
  applyStyles(); renderPlan();
}
q.addEventListener('input',()=>{ if(!detailEl.hidden && !editing){ detailEl.hidden=true; listEl.hidden=false; selected=null; } render(); });
q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const first=listEl.querySelector('.row'); if(first) first.click(); } if(e.key==='Escape'){ q.value=''; closeDetail(); render(); } });
qclear.onclick=()=>{ q.value=''; closeDetail(); render(); q.focus(); };

// ================= SAVING (shared store, with device-only fallback) =================
let db=null, canWrite=null; const saveEl=document.getElementById('savestate');
const LS='nfp-unit-edits-v1';
function lsLoad(){ try{ const v=JSON.parse(localStorage.getItem(LS)||'{}'); Object.assign(ovC,v.c||{}); Object.assign(ovI,v.i||{}); }catch(e){} }
function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify({c:ovC,i:ovI})); }catch(e){} }
function refreshAfterChange(changedIds){
  changedIds.forEach(id=>{ if(byId[id]) build(id); }); applyStyles(); render();
  
}
async function saveC(id,data){
  if (data) ovC[id]=data; else delete ovC[id];
  refreshAfterChange([id]); showDetail(id);
  if (db){ try{ saveEl.textContent='Saving…'; data ? await db.doc('containers/'+id).set(data) : await db.doc('containers/'+id).delete(); saveEl.textContent='All edits saved'; }
    catch(e){ readOnlyFail(e); } } else { lsSave(); saveEl.textContent='Saved on this device only'; }
}
async function saveI(key,data){
  if (data) ovI[key]=data; else delete ovI[key];
  refreshAfterChange([]); if(data) showInvDetail(key);
  if (db){ try{ saveEl.textContent='Saving…'; data ? await db.doc('inventory/'+key).set(data) : await db.doc('inventory/'+key).delete(); saveEl.textContent='All edits saved'; }
    catch(e){ readOnlyFail(e); } } else { lsSave(); saveEl.textContent='Saved on this device only'; }
}
function readOnlyFail(e){
  if (e && e.code==='invalid_argument'){ canWrite=false; saveEl.textContent='You can view this page but not edit it'; render(); }
  else if (e && e.code==='quota_exceeded') saveEl.textContent='Storage is full, so that edit was not saved';
  else saveEl.textContent='Could not save that edit. Check your connection and try again.';
}
async function connect(){
  if (!window.claude || !window.claude.use){ lsLoad(); saveEl.textContent='Edits save on this device only'; refreshAfterChange(C.map(c=>c.id)); return; }
  try{ db = await window.claude.use('db'); }catch(e){ db=null; }
  try{ const user = await window.claude.use('user'); if(user){ const c=await user.can('data.write'); if(c===false) canWrite=false; } }catch(e){}
  if (!db){ lsLoad(); saveEl.textContent='Edits save on this device only'; refreshAfterChange(C.map(c=>c.id)); return; }
  saveEl.textContent = canWrite===false ? 'View only' : 'Loading saved edits…';
  const timer=setTimeout(()=>{ saveEl.textContent='Saved edits can’t be reached yet'; },10000);
  db.collection('containers').onSnapshot(snap=>{
    if(!snap.metadata.fromCache) clearTimeout(timer);
    const changed=[]; snap.docChanges().forEach(ch=>{ const id=ch.doc.id; if(ch.type==='removed') delete ovC[id]; else ovC[id]=ch.doc.data(); changed.push(id); });
    if(changed.length) refreshAfterChange(changed);
    if(!snap.metadata.fromCache && canWrite!==false) saveEl.textContent='All edits saved';
  }, e=>{ clearTimeout(timer); saveEl.textContent='Saved edits are unavailable right now'; });
  db.collection('inventory').onSnapshot(snap=>{
    let n=0; snap.docChanges().forEach(ch=>{ const k=ch.doc.id; if(ch.type==='removed') delete ovI[k]; else ovI[k]=ch.doc.data(); n++; });
    if(n) refreshAfterChange([]);
  }, ()=>{});
  render();
}

// ================= LOOP =================
function resize(){ const r=view.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); renderer.domElement.style.width='100%'; renderer.domElement.style.height='100%'; camera.aspect=r.width/Math.max(1,r.height); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(view);
let last=performance.now();
function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(nav==='walk') stepWalk(dt); else { if(anim) anim(now); controls.update(); }
  if(mode==='3d') renderer.render(scene,camera); requestAnimationFrame(loop); }

themeScene();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeScene);
new MutationObserver(themeScene).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
layerButtons(); buildAll(); resize(); render(); walk.x=5; walk.z=0.4; walk.y=5.2; walk.yaw=0; walk.pitch=-0.12; setNav('walk'); requestAnimationFrame(loop);
document.fonts && document.fonts.load('700 40px Kalam').then(()=>{ Object.keys(stickyCache).forEach(k=>delete stickyCache[k]); buildAll(); }).catch(()=>{});
connect();
